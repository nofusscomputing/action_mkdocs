---

name: 'MKDocs'


on:
  workflow_call:



jobs:


  lint:
    name: 'Lint'
    env:
      MDLINT_PATHS: '"docs/*.md docs/**/*.md docs/**/**/*.md docs/**/**/**/*.md docs/**/**/**/**/**/*.md !CHANGELOG.md"'
    runs-on: ubuntu-latest
    steps:


      - name: Checkout Code - ${{ github.ref_name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1


      - name: Install Dependencies
        shell: bash
        run: |
          sudo apt update;
          sudo apt install -y --no-install-recommends npm;


      - name: Install Linter
        shell: bash
        run: |
          npm install markdownlint-cli2@v0.18.1 --global;
          npm install markdownlint-cli2-formatter-junit --global;
          npm install markdownlint-cli2-formatter-template --global;


      - name: Create Artifact directory
        shell: bash
        run: |
          mkdir -p artifacts


      - name: Enable Problem Matcher
        shell: bash
        run: |
          echo "NFC_PROBLEM_MATCHER=${GITHUB_REF_NAME}";
          echo "NFC_PROBLEM_MATCHER_TYPE=markdown-lint";


      - name: Lint
        id: lint
        shell: bash
        run: |
          markdownlint-cli2 $MDLINT_PATHS 1>&1 || EXITCODE=$?

          mv -vf markdown.junit.xml "artifacts/markdown_lint.junit.xml";

          exit ${EXITCODE};


      - name: debug ls
        if: success() || failure()
        shell: bash
        run: |
          ls -la artifacts/;


      - name: Upload build Artifact
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a    # v7.0.1
        with:
          name: mkdocs-lint
          path: artifacts/



  lint-reports:
    name: 'Create Report'
    if: success() || failure()
    needs:
      - lint
    runs-on: ubuntu-latest
    steps:


      - name: Markdown Lint
        if: success() || failure()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2    # v3.0.0
        with:
          artifact: mkdocs-lint
          fail-on-error: 'false'
          name: Markdown Lint Report
          path: 'markdown_lint.junit.xml'
          reporter: java-junit



